<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Safira MusiCloud{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-cloud"></i> Safira MusiCloud</h3>
        </div>
        <div class="sidebar-divider"></div>
        <ul class="sidebar-nav">
            <li><a href="{{ url_for('main.menu') }}" class="nav-link"><i class="fas fa-home"></i> <span>Menu</span></a></li>
            <li><a href="{{ url_for('main.people') }}" class="nav-link"><i class="fas fa-user-friends"></i> <span>Pessoas</span></a></li>
            <li><a href="{{ url_for('main.courses') }}" class="nav-link"><i class="fas fa-music"></i> <span>Cursos</span></a></li>
            <li><a href="{{ url_for('main.schedule') }}" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>Agenda</span></a></li>
            <li><a href="{{ url_for('main.attendance') }}" class="nav-link"><i class="fas fa-check-square"></i> <span>Assinatura</span></a></li>
            <li><a href="{{ url_for('main.finance') }}" class="nav-link"><i class="fas fa-dollar-sign"></i> <span>Financeiro</span></a></li>
            <li style="margin-top: auto;"><a href="{{ url_for('auth.logout') }}" class="nav-link"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a></li>
        </ul>
    </div>

    <header>
        <button class="menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="header-title">
            <h2>{% block header_title %}{% endblock %}</h2>
        </div>
        <div class="user-info" style="margin-left: auto; display: flex; align-items: center;">
            <span style="margin-right: 10px;">Olá, {{ session.username }}</span>
            <i class="fas fa-user-circle fa-2x"></i>
        </div>
    </header>

    <div class="main-content">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
