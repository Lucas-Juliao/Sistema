<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Admin Panel</h3>
        </div>
        <ul class="sidebar-nav">
            <li><a href="{{ url_for('main.dashboard') }}" class="nav-link" data-path="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="{{ url_for('main.users') }}" class="nav-link" data-path="/users"><i class="fas fa-users"></i> Users</a></li>
            <li><a href="#" class="nav-link"><i class="fas fa-chart-bar"></i> Reports</a></li>
            <li><a href="{{ url_for('main.settings') }}" class="nav-link" data-path="/settings"><i class="fas fa-cogs"></i> Settings</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <div class="header-title">
                <h2>{% block header_title %}{% endblock %}</h2>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
