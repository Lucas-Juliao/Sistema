{% extends 'base.html' %}

{% block title %}Cursos - Safira MusiCloud{% endblock %}

{% block content %}
<div class="breadcrumb-path">
    <a href="{{ url_for('main.menu') }}">Menu</a> > <span>Cadastro de Cursos</span>
</div>

<div class="filter-bar mb-3">
    <div class="input-group">
        <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar curso, professor...">
        <button class="btn btn-outline-primary" type="button" id="filterBtn">
            <i class="fas fa-filter me-1"></i> Filtrar
        </button>
    </div>
</div>

<div class="d-flex justify-content-start mb-2">
    <button class="btn-subtle" onclick="openModal('addModal')">
        <i class="fas fa-plus-circle me-1"></i> Inserir novo curso
    </button>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="dataTable" style="min-width: 800px;">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4" style="width: 35%;">Nome do Curso</th>
                        <th style="width: 20%;">Carga Horária</th>
                        <th style="width: 30%;">Professor Responsável</th>
                        <th class="text-center pe-4" style="width: 15%;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS vai carregar os dados aqui -->
                </tbody>
            </table>
        </div>
        <div class="pagination-container" id="pagination"></div>
    </div>
</div>

<!-- Modal Adicionar -->
<div id="addModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>Novo Curso</h5>
            <span class="close-custom" onclick="closeModal('addModal')">&times;</span>
        </div>
        <form action="{{ url_for('main.add_course') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nome do Curso</label>
                <input type="text" name="name" class="form-control" required placeholder="Ex: Piano Clássico">
            </div>
            <div class="mb-3">
                <label class="form-label">Carga Horária (horas)</label>
                <input type="number" name="workload" class="form-control" placeholder="Ex: 40">
            </div>
            <div class="mb-3">
                <label class="form-label">Professor</label>
                <select name="teacher_id" class="form-select">
                    <option value="">Selecione um professor...</option>
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}">{{ teacher.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="text-end mt-4">
                <button type="button" class="btn btn-secondary me-2" onclick="closeModal('addModal')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar -->
<div id="editModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>Editar Curso</h5>
            <span class="close-custom" onclick="closeModal('editModal')">&times;</span>
        </div>
        <form id="editForm" method="POST">
            <div class="mb-3">
                <label class="form-label">Nome do Curso</label>
                <input type="text" name="name" id="editName" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Carga Horária (horas)</label>
                <input type="number" name="workload" id="editWorkload" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Professor</label>
                <select name="teacher_id" id="editTeacherId" class="form-select">
                    <option value="">Selecione um professor...</option>
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}">{{ teacher.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="text-end mt-4">
                <button type="button" class="btn btn-secondary me-2" onclick="closeModal('editModal')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Atualizar</button>
            </div>
        </form>
    </div>
</div>

<script>
    const allData = [
        {% for course in courses %}
        {
            id: "{{ course.id }}",
            name: "{{ course.name }}",
            workload: "{{ course.workload or 0 }}",
            teacher_id: "{{ course.teacher_id or '' }}",
            teacher_name: "{{ course.teacher_name or '' }}"
        },
        {% endfor %}
    ];

    let filteredData = [];
    const itemsPerPage = 5;
    let currentPage = 1;

    function renderTable() {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted">Clique em 'Filtrar' para carregar os dados.</td></tr>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = filteredData.slice(start, end);

        pageData.forEach(course => {
            const row = `
                <tr>
                    <td class="ps-4 align-middle">
                        <strong>${course.name}</strong>
                    </td>
                    <td class="align-middle">
                        <span class="badge bg-light text-dark border">
                            ${course.workload} horas
                        </span>
                    </td>
                    <td class="align-middle text-muted">
                        ${course.teacher_name ?
                            `<i class="fas fa-chalkboard-teacher me-1"></i> ${course.teacher_name}` :
                            `<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i> Sem professor</span>`}
                    </td>
                    <td class="text-center pe-4 align-middle">
                        <button class="btn btn-sm btn-light text-primary border me-1" title="Editar"
                            onclick="openEditModal('${course.id}', '${course.name}', '${course.workload}', '${course.teacher_id}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <a href="/courses/delete/${course.id}" class="btn btn-sm btn-light text-danger border" title="Excluir" onclick="return confirm('Tem certeza que deseja excluir?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        container.innerHTML = '';
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            container.appendChild(btn);
        }
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
        const term = document.getElementById('searchInput').value.toLowerCase();
        filteredData = allData.filter(item =>
            item.name.toLowerCase().includes(term) ||
            item.teacher_name.toLowerCase().includes(term)
        );
        currentPage = 1;
        renderTable();
    });

    document.addEventListener('DOMContentLoaded', () => {
        renderTable();
    });

    function openModal(id) {
        document.getElementById(id).style.display = "block";
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    function openEditModal(id, name, workload, teacherId) {
        const form = document.getElementById('editForm');
        form.action = "/courses/edit/" + id;
        document.getElementById('editName').value = name;
        document.getElementById('editWorkload').value = workload;
        document.getElementById('editTeacherId').value = teacherId;
        openModal('editModal');
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal-custom')) {
            event.target.style.display = "none";
        }
    }
</script>

<style>
    .modal-custom {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content-custom {
        background-color: #fefefe;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 500px;
        max-width: 90%;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal-header-custom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    .close-custom {
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close-custom:hover {
        color: #002b5c;
    }
</style>
{% endblock %}
