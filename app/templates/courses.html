{% extends 'base.html' %}

{% block title %}Cursos - Safira MusiCloud{% endblock %}

{% block content %}
<div class="breadcrumb-path">
    <a href="{{ url_for('main.menu') }}">Menu</a> > <span>Cadastro de Cursos</span>
</div>

<div class="filter-bar mb-3">
    <div class="input-group">
        <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar curso, professor...">
        <button class="btn btn-outline-primary" type="button" id="filterBtn">
            <i class="fas fa-filter me-1"></i> Filtrar
        </button>
    </div>
</div>

<div class="d-flex justify-content-start mb-2">
    <button class="btn-insert" onclick="openModal('addModal')">
        Inserir
    </button>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="dataTable" style="min-width: 800px;">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4" style="width: 5%;"></th>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 40%;">Nome do Curso</th>
                        <th style="width: 15%;">Carga Horária</th>
                        <th style="width: 30%;">Professor Responsável</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS vai carregar os dados aqui -->
                </tbody>
            </table>
        </div>
        <div class="pagination-container" id="pagination"></div>
    </div>
</div>

<!-- Modal Adicionar -->
<div id="addModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>NOVO CURSO</h5>
            <span class="close-custom" onclick="closeModal('addModal')">&times;</span>
        </div>
        <div class="modal-body-custom">
            <form action="{{ url_for('main.add_course') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">NOME DO CURSO</label>
                    <input type="text" name="name" class="form-control uppercase-input" required placeholder="EX: PIANO CLÁSSICO">
                </div>
                <div class="mb-3">
                    <label class="form-label">CARGA HORÁRIA (HORAS)</label>
                    <input type="number" name="workload" class="form-control" placeholder="EX: 40">
                </div>
                <div class="mb-3">
                    <label class="form-label">PROFESSOR</label>
                    <select name="teacher_id" class="form-select uppercase-input">
                        <option value="">SELECIONE UM PROFESSOR...</option>
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}">{{ teacher.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="text-end mt-4 mb-2">
                    <button type="button" class="btn btn-secondary me-2" onclick="closeModal('addModal')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary">SALVAR</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Editar -->
<div id="editModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>EDITAR CURSO</h5>
            <span class="close-custom" onclick="closeModal('editModal')">&times;</span>
        </div>
        <div class="modal-body-custom">
            <form id="editForm" method="POST">
                <div class="mb-3">
                    <label class="form-label">NOME DO CURSO</label>
                    <input type="text" name="name" id="editName" class="form-control uppercase-input" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">CARGA HORÁRIA (HORAS)</label>
                    <input type="number" name="workload" id="editWorkload" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">PROFESSOR</label>
                    <select name="teacher_id" id="editTeacherId" class="form-select uppercase-input">
                        <option value="">SELECIONE UM PROFESSOR...</option>
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}">{{ teacher.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="text-end mt-4 mb-2">
                    <button type="button" class="btn btn-secondary me-2" onclick="closeModal('editModal')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary">ATUALIZAR</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const allData = [
        {% for course in courses %}
        {
            id: "{{ course.id }}",
            name: "{{ course.name }}",
            workload: "{{ course.workload or 0 }}",
            teacher_id: "{{ course.teacher_id or '' }}",
            teacher_name: "{{ course.teacher_name or '' }}"
        },
        {% endfor %}
    ];

    let filteredData = [];
    const itemsPerPage = 5;
    let currentPage = 1;

    function renderTable() {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">Clique em 'Filtrar' para carregar os dados.</td></tr>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = filteredData.slice(start, end);

        pageData.forEach((course, index) => {
            const row = `
                <tr class="fade-in" style="animation-delay: ${index * 0.05}s">
                    <td class="ps-4 align-middle">
                        <div class="dropdown">
                            <button class="btn btn-link text-muted p-0 border-0 gear-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-cog"></i>
                            </button>
                            <ul class="dropdown-menu shadow border">
                                <li><button class="dropdown-item" type="button" onclick="openEditModal('${course.id}', '${course.name}', '${course.workload}', '${course.teacher_id}')"><i class="fas fa-edit me-2 text-primary"></i> EDITAR</button></li>
                                <li><button class="dropdown-item" type="button" onclick="viewCourse('${course.id}', '${course.name}', '${course.workload}', '${course.teacher_id}')"><i class="fas fa-eye me-2 text-info"></i> VISUALIZAR</button></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="/courses/delete/${course.id}" onclick="return confirm('Tem certeza que deseja excluir?')"><i class="fas fa-trash me-2"></i> EXCLUIR</a></li>
                            </ul>
                        </div>
                    </td>
                    <td class="align-middle text-muted">${course.id}</td>
                    <td class="align-middle">
                        <strong>${course.name.toUpperCase()}</strong>
                    </td>
                    <td class="align-middle">
                        <span class="badge bg-light text-dark border">
                            ${course.workload} HORAS
                        </span>
                    </td>
                    <td class="align-middle text-muted">
                        ${course.teacher_name ?
                            `<i class="fas fa-chalkboard-teacher me-1"></i> ${course.teacher_name.toUpperCase()}` :
                            `<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i> SEM PROFESSOR</span>`}
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        container.innerHTML = '';
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            container.appendChild(btn);
        }
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
        const btn = document.getElementById('filterBtn');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Filtrando...';
        btn.disabled = true;

        setTimeout(() => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            filteredData = allData.filter(item =>
                item.name.toLowerCase().includes(term) ||
                item.teacher_name.toLowerCase().includes(term)
            );
            currentPage = 1;
            renderTable();

            btn.innerHTML = originalContent;
            btn.disabled = false;
        }, 400);
    });

    document.addEventListener('DOMContentLoaded', () => {
        renderTable();

        // Uppercase enforcement on input
        document.addEventListener('input', (e) => {
            if (e.target.classList.contains('uppercase-input')) {
                e.target.value = e.target.value.toUpperCase();
            }
        });

        // Ensure all forms convert data to uppercase before submit
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', () => {
                form.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(input => {
                    input.value = input.value.toUpperCase();
                });
            });
        });
    });

    function openModal(id) {
        document.getElementById(id).style.display = "block";
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    function openEditModal(id, name, workload, teacherId) {
        const form = document.getElementById('editForm');
        form.action = "/courses/edit/" + id;
        document.getElementById('editName').value = name;
        document.getElementById('editWorkload').value = workload;
        document.getElementById('editTeacherId').value = teacherId;

        // Reset read-only status
        document.getElementById('editName').readOnly = false;
        document.getElementById('editWorkload').readOnly = false;
        document.getElementById('editTeacherId').disabled = false;
        document.querySelector('#editForm button[type="submit"]').style.display = "inline-block";
        document.querySelector('#editModal h5').innerText = "Editar Curso";

        openModal('editModal');
    }

    function viewCourse(id, name, workload, teacherId) {
        openEditModal(id, name, workload, teacherId);
        document.getElementById('editName').readOnly = true;
        document.getElementById('editWorkload').readOnly = true;
        document.getElementById('editTeacherId').disabled = true;
        document.querySelector('#editForm button[type="submit"]').style.display = "none";
        document.querySelector('#editModal h5').innerText = "Visualizar Curso";
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal-custom')) {
            event.target.style.display = "none";
        }
    }
</script>

<style>
    .modal-custom {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content-custom {
        background-color: #fefefe;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 500px;
        max-width: 90%;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal-header-custom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    .close-custom {
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close-custom:hover {
        color: #002b5c;
    }
</style>
{% endblock %}
