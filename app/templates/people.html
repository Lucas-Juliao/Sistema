{% extends 'base.html' %}

{% block title %}Pessoas - Safira MusiCloud{% endblock %}

{% block content %}
<div class="breadcrumb-path">
    <a href="{{ url_for('main.menu') }}">Menu</a> > <span>Cadastro de Pessoas</span>
</div>

<div class="filter-bar mb-3">
    <div class="input-group">
        <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar por nome, e-mail...">
        <button class="btn btn-outline-primary" type="button" id="filterBtn">
            <i class="fas fa-filter me-1"></i> Filtrar
        </button>
    </div>
</div>

<div class="d-flex justify-content-start mb-2">
    <button class="btn-insert" onclick="openModal('addModal')">
        Inserir
    </button>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="dataTable" style="min-width: 800px;">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4" style="width: 45%;">Nome</th>
                        <th style="width: 15%;">Tipo</th>
                        <th style="width: 25%;">E-mail</th>
                        <th style="width: 15%;">Telefone</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS vai carregar os dados aqui -->
                </tbody>
            </table>
        </div>
        <div class="pagination-container" id="pagination">
            <!-- Pagination buttons will be injected here -->
        </div>
    </div>
</div>

<!-- Modal Adicionar -->
<div id="addModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>Nova Pessoa</h5>
            <span class="close-custom" onclick="closeModal('addModal')">&times;</span>
        </div>
        <form action="{{ url_for('main.add_person') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select name="type" class="form-select" required>
                    <option value="student">Aluno</option>
                    <option value="teacher">Professor</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" name="phone" class="form-control">
            </div>
            <div class="text-end mt-4">
                <button type="button" class="btn btn-secondary me-2" onclick="closeModal('addModal')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar -->
<div id="editModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>Editar Pessoa</h5>
            <span class="close-custom" onclick="closeModal('editModal')">&times;</span>
        </div>
        <form id="editForm" method="POST">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" name="name" id="editName" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select name="type" id="editType" class="form-select" required>
                    <option value="student">Aluno</option>
                    <option value="teacher">Professor</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" id="editEmail" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" name="phone" id="editPhone" class="form-control">
            </div>
            <div class="text-end mt-4">
                <button type="button" class="btn btn-secondary me-2" onclick="closeModal('editModal')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Atualizar</button>
            </div>
        </form>
    </div>
</div>

<script>
    const allData = [
        {% for person in people %}
        {
            id: "{{ person.id }}",
            name: "{{ person.name }}",
            type: "{{ person.type }}",
            email: "{{ person.email or '' }}",
            phone: "{{ person.phone or '' }}",
            typeDisplay: "{{ 'Professor' if person.type == 'teacher' else 'Aluno' }}",
            badgeClass: "{{ 'bg-info' if person.type == 'teacher' else 'bg-success' }}"
        },
        {% endfor %}
    ];

    let filteredData = [];
    const itemsPerPage = 5;
    let currentPage = 1;

    function renderTable() {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted">Clique em 'Filtrar' para carregar os dados.</td></tr>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = filteredData.slice(start, end);

        pageData.forEach(person => {
            const row = `
                <tr>
                    <td class="ps-4 align-middle">
                        <div class="d-flex align-items-center">
                            <div class="dropdown me-3">
                                <button class="btn btn-link text-muted p-0 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fas fa-cog"></i>
                                </button>
                                <ul class="dropdown-menu shadow border-0">
                                    <li><a class="dropdown-item" href="javascript:void(0)" onclick="openEditModal('${person.id}', '${person.name}', '${person.type}', '${person.email}', '${person.phone}')"><i class="fas fa-edit me-2 text-primary"></i> Editar</a></li>
                                    <li><a class="dropdown-item" href="javascript:void(0)" onclick="viewPerson('${person.id}', '${person.name}', '${person.type}', '${person.email}', '${person.phone}')"><i class="fas fa-eye me-2 text-info"></i> Visualizar</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item text-danger" href="/people/delete/${person.id}" onclick="return confirm('Tem certeza que deseja excluir?')"><i class="fas fa-trash me-2"></i> Excluir</a></li>
                                </ul>
                            </div>
                            <div class="rounded-circle bg-blue text-white d-flex align-items-center justify-content-center me-3" style="width: 35px; height: 35px; flex-shrink: 0;">
                                ${person.name[0].toUpperCase()}
                            </div>
                            <span class="text-truncate" style="max-width: 200px;"><strong>${person.name}</strong></span>
                        </div>
                    </td>
                    <td class="align-middle">
                        <span class="badge ${person.badgeClass}" style="width: 80px;">
                            ${person.typeDisplay}
                        </span>
                    </td>
                    <td class="align-middle text-muted">${person.email || '-'}</td>
                    <td class="align-middle text-muted">${person.phone || '-'}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        container.innerHTML = '';
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            container.appendChild(btn);
        }
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
        const term = document.getElementById('searchInput').value.toLowerCase();
        filteredData = allData.filter(item =>
            item.name.toLowerCase().includes(term) ||
            item.email.toLowerCase().includes(term) ||
            item.phone.toLowerCase().includes(term)
        );
        currentPage = 1;
        renderTable();
    });

    // Inicializar tabela vazia
    document.addEventListener('DOMContentLoaded', () => {
        renderTable();
    });

    function openModal(id) {
        document.getElementById(id).style.display = "block";
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    function openEditModal(id, name, type, email, phone) {
        const form = document.getElementById('editForm');
        form.action = "/people/edit/" + id;
        document.getElementById('editName').value = name;
        document.getElementById('editType').value = type;
        document.getElementById('editEmail').value = email;
        document.getElementById('editPhone').value = phone;

        // Reset read-only status
        document.getElementById('editName').readOnly = false;
        document.getElementById('editType').disabled = false;
        document.getElementById('editEmail').readOnly = false;
        document.getElementById('editPhone').readOnly = false;
        document.querySelector('#editForm button[type="submit"]').style.display = "inline-block";
        document.querySelector('#editModal h5').innerText = "Editar Pessoa";

        openModal('editModal');
    }

    function viewPerson(id, name, type, email, phone) {
        openEditModal(id, name, type, email, phone);
        document.getElementById('editName').readOnly = true;
        document.getElementById('editType').disabled = true;
        document.getElementById('editEmail').readOnly = true;
        document.getElementById('editPhone').readOnly = true;
        document.querySelector('#editForm button[type="submit"]').style.display = "none";
        document.querySelector('#editModal h5').innerText = "Visualizar Pessoa";
    }

    // Fechar modal ao clicar fora dele
    window.onclick = function(event) {
        if (event.target.classList.contains('modal-custom')) {
            event.target.style.display = "none";
        }
    }
</script>

<style>
    .modal-custom {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content-custom {
        background-color: #fefefe;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 500px;
        max-width: 90%;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal-header-custom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    .close-custom {
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close-custom:hover {
        color: #002b5c;
    }
    .bg-blue {
        background-color: #002b5c;
    }
</style>
{% endblock %}
