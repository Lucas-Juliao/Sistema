{% extends "base.html" %}

{% block title %}Cadastro de Pessoas - Safira MusiCloud{% endblock %}
{% block header_title %}Cadastro de Pessoas{% endblock %}

{% block content %}
<div class="form-container">
    <form id="person-form">
        <div class="form-group">
            <label for="name">Nome Completo</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="type">Tipo</label>
            <select id="type" name="type" class="form-control" required>
                <option value="">Selecione...</option>
                <option value="student">Aluno</option>
                <option value="teacher">Professor</option>
            </select>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-control">
        </div>
        <div class="form-group">
            <label for="phone">Telefone</label>
            <input type="text" id="phone" name="phone" class="form-control">
        </div>
        <button type="submit" class="btn-primary">Salvar Cadastro</button>
    </form>
</div>

<hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

<h3>Pessoas Cadastradas (Exemplo)</h3>
<div class="card" style="padding: 10px;">
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="border-bottom: 2px solid #eee; text-align: left;">
                <th style="padding: 10px;">Nome</th>
                <th style="padding: 10px;">Tipo</th>
                <th style="padding: 10px;">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="padding: 10px;">João Silva</td>
                <td style="padding: 10px;">Aluno</td>
                <td style="padding: 10px;"><i class="fas fa-edit"></i> <i class="fas fa-trash"></i></td>
            </tr>
            <tr>
                <td style="padding: 10px;">Maria Oliveira</td>
                <td style="padding: 10px;">Professor</td>
                <td style="padding: 10px;"><i class="fas fa-edit"></i> <i class="fas fa-trash"></i></td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
