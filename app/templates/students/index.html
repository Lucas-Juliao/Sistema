{% extends "base.html" %}
{% block title %}Students{% endblock %}
{% block content %}
    <h1>Students</h1>
    <a href="{{ url_for('students.create') }}">Add Student</a>
    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Enrollment Date</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.user.username }}</td>
                <td>{{ student.user.email }}</td>
                <td>{{ student.enrollment_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
