{% extends 'base.html' %}

{% block title %}Agenda - Safira MusiCloud{% endblock %}

{% block content %}
<div class="breadcrumb-path">
    <a href="{{ url_for('main.menu') }}">Menu</a> > <span>Gestão de Agenda</span>
</div>

<div class="filter-bar mb-3">
    <div class="input-group">
        <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar professor, dia, curso...">
        <button class="btn btn-outline-primary" type="button" id="filterBtn">
            <i class="fas fa-filter me-1"></i> Filtrar
        </button>
    </div>
</div>

<div class="d-flex justify-content-start mb-2">
    <button class="btn-insert" onclick="openModal('addModal')">
        Inserir
    </button>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="dataTable" style="min-width: 800px;">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4" style="width: 5%;"></th>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 25%;">Dia da Semana</th>
                        <th style="width: 20%;">Professor</th>
                        <th style="width: 20%;">Horário</th>
                        <th style="width: 15%;">Curso</th>
                        <th style="width: 15%;">Sala</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS vai carregar os dados aqui -->
                </tbody>
            </table>
        </div>
        <div class="pagination-container" id="pagination"></div>
    </div>
</div>

<!-- Modal Adicionar -->
<div id="addModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>NOVO HORÁRIO NA AGENDA</h5>
            <span class="close-custom" onclick="closeModal('addModal')">&times;</span>
        </div>
        <div class="modal-body-custom">
            <form action="{{ url_for('main.add_schedule') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">PROFESSOR</label>
                    <select name="teacher_id" class="form-select uppercase-input" required>
                        <option value="">SELECIONE UM PROFESSOR...</option>
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}">{{ teacher.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">DIA DA SEMANA</label>
                    <select name="day_of_week" class="form-select uppercase-input" required>
                        <option value="segunda-feira">SEGUNDA-FEIRA</option>
                        <option value="terça-feira">TERÇA-FEIRA</option>
                        <option value="quarta-feira">QUARTA-FEIRA</option>
                        <option value="quinta-feira">QUINTA-FEIRA</option>
                        <option value="sexta-feira">SEXTA-FEIRA</option>
                        <option value="sábado">SÁBADO</option>
                        <option value="domingo">DOMINGO</option>
                    </select>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">HORA INÍCIO</label>
                        <input type="time" name="start_time" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">HORA FIM</label>
                        <input type="time" name="end_time" class="form-control" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">NOME DO CURSO (OPCIONAL)</label>
                        <input type="text" name="course_name" class="form-control uppercase-input" placeholder="EX: PIANO I">
                    </div>
                    <div class="col">
                        <label class="form-label">SALA</label>
                        <input type="text" name="room" class="form-control uppercase-input" placeholder="EX: SALA 01">
                    </div>
                </div>
                <div class="text-end mt-4 mb-2">
                    <button type="button" class="btn btn-secondary me-2" onclick="closeModal('addModal')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary">SALVAR</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Editar -->
<div id="editModal" class="modal-custom">
    <div class="modal-content-custom">
        <div class="modal-header-custom">
            <h5>EDITAR HORÁRIO</h5>
            <span class="close-custom" onclick="closeModal('editModal')">&times;</span>
        </div>
        <div class="modal-body-custom">
            <form id="editForm" method="POST">
                <div class="mb-3">
                    <label class="form-label">PROFESSOR</label>
                    <select name="teacher_id" id="editTeacherId" class="form-select uppercase-input" required>
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}">{{ teacher.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">DIA DA SEMANA</label>
                    <select name="day_of_week" id="editDayOfWeek" class="form-select uppercase-input" required>
                        <option value="segunda-feira">SEGUNDA-FEIRA</option>
                        <option value="terça-feira">TERÇA-FEIRA</option>
                        <option value="quarta-feira">QUARTA-FEIRA</option>
                        <option value="quinta-feira">QUINTA-FEIRA</option>
                        <option value="sexta-feira">SEXTA-FEIRA</option>
                        <option value="sábado">SÁBADO</option>
                        <option value="domingo">DOMINGO</option>
                    </select>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">HORA INÍCIO</label>
                        <input type="time" name="start_time" id="editStartTime" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">HORA FIM</label>
                        <input type="time" name="end_time" id="editEndTime" class="form-control" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">NOME DO CURSO</label>
                        <input type="text" name="course_name" id="editCourseName" class="form-control uppercase-input">
                    </div>
                    <div class="col">
                        <label class="form-label">SALA</label>
                        <input type="text" name="room" id="editRoom" class="form-control uppercase-input">
                    </div>
                </div>
                <div class="text-end mt-4 mb-2">
                    <button type="button" class="btn btn-secondary me-2" onclick="closeModal('editModal')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary">ATUALIZAR</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const allData = [
        {% for item in schedules %}
        {
            id: "{{ item.id }}",
            teacher_id: "{{ item.teacher_id }}",
            teacher_name: "{{ item.teacher_name }}",
            day_of_week: "{{ item.day_of_week }}",
            start_time: "{{ item.start_time }}",
            end_time: "{{ item.end_time }}",
            course_name: "{{ item.course_name or '' }}",
            room: "{{ item.room or '' }}"
        },
        {% endfor %}
    ];

    let filteredData = [];
    const itemsPerPage = 5;
    let currentPage = 1;

    function renderTable() {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-muted">Clique em 'Filtrar' para carregar os dados.</td></tr>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageData = filteredData.slice(start, end);

        pageData.forEach((item, index) => {
            const row = `
                <tr class="fade-in" style="animation-delay: ${index * 0.05}s">
                    <td class="ps-4 align-middle">
                        <div class="dropdown">
                            <button class="btn btn-link text-muted p-0 border-0 gear-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-cog"></i>
                            </button>
                            <ul class="dropdown-menu shadow border">
                                <li><button class="dropdown-item" type="button" onclick="openEditModal('${item.id}', '${item.teacher_id}', '${item.day_of_week}', '${item.start_time}', '${item.end_time}', '${item.course_name}', '${item.room}')"><i class="fas fa-edit me-2 text-primary"></i> EDITAR</button></li>
                                <li><button class="dropdown-item" type="button" onclick="viewSchedule('${item.id}', '${item.teacher_id}', '${item.day_of_week}', '${item.start_time}', '${item.end_time}', '${item.course_name}', '${item.room}')"><i class="fas fa-eye me-2 text-info"></i> VISUALIZAR</button></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="/schedule/delete/${item.id}" onclick="return confirm('Tem certeza que deseja excluir?')"><i class="fas fa-trash me-2"></i> EXCLUIR</a></li>
                            </ul>
                        </div>
                    </td>
                    <td class="align-middle text-muted">${item.id}</td>
                    <td class="align-middle">
                        <span class="text-uppercase fw-bold">${item.day_of_week}</span>
                    </td>
                    <td class="align-middle">
                        <i class="fas fa-user-tie me-1 text-muted"></i> ${item.teacher_name.toUpperCase()}
                    </td>
                    <td class="align-middle">
                        <span class="badge bg-light text-dark border">
                            ${item.start_time} - ${item.end_time}
                        </span>
                    </td>
                    <td class="align-middle text-muted italic">
                        ${(item.course_name || '-').toUpperCase()}
                    </td>
                    <td class="align-middle text-muted">
                        <i class="fas fa-door-open me-1"></i> ${(item.room || '-').toUpperCase()}
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        container.innerHTML = '';
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            container.appendChild(btn);
        }
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
        const btn = document.getElementById('filterBtn');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Filtrando...';
        btn.disabled = true;

        setTimeout(() => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            filteredData = allData.filter(item =>
                item.teacher_name.toLowerCase().includes(term) ||
                item.day_of_week.toLowerCase().includes(term) ||
                item.course_name.toLowerCase().includes(term)
            );
            currentPage = 1;
            renderTable();

            btn.innerHTML = originalContent;
            btn.disabled = false;
        }, 400);
    });

    document.addEventListener('DOMContentLoaded', () => {
        renderTable();

        // Uppercase enforcement on input
        document.addEventListener('input', (e) => {
            if (e.target.classList.contains('uppercase-input')) {
                e.target.value = e.target.value.toUpperCase();
            }
        });

        // Ensure all forms convert data to uppercase before submit
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', () => {
                form.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(input => {
                    input.value = input.value.toUpperCase();
                });
            });
        });
    });

    function openModal(id) {
        document.getElementById(id).style.display = "block";
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    function openEditModal(id, teacherId, day, start, end, course, room) {
        const form = document.getElementById('editForm');
        form.action = "/schedule/edit/" + id;
        document.getElementById('editTeacherId').value = teacherId;
        document.getElementById('editDayOfWeek').value = day;
        document.getElementById('editStartTime').value = start;
        document.getElementById('editEndTime').value = end;
        document.getElementById('editCourseName').value = course;
        document.getElementById('editRoom').value = room;

        // Reset read-only status
        document.getElementById('editTeacherId').disabled = false;
        document.getElementById('editDayOfWeek').disabled = false;
        document.getElementById('editStartTime').readOnly = false;
        document.getElementById('editEndTime').readOnly = false;
        document.getElementById('editCourseName').readOnly = false;
        document.getElementById('editRoom').readOnly = false;
        document.querySelector('#editForm button[type="submit"]').style.display = "inline-block";
        document.querySelector('#editModal h5').innerText = "Editar Horário";

        openModal('editModal');
    }

    function viewSchedule(id, teacherId, day, start, end, course, room) {
        openEditModal(id, teacherId, day, start, end, course, room);
        document.getElementById('editTeacherId').disabled = true;
        document.getElementById('editDayOfWeek').disabled = true;
        document.getElementById('editStartTime').readOnly = true;
        document.getElementById('editEndTime').readOnly = true;
        document.getElementById('editCourseName').readOnly = true;
        document.getElementById('editRoom').readOnly = true;
        document.querySelector('#editForm button[type="submit"]').style.display = "none";
        document.querySelector('#editModal h5').innerText = "Visualizar Horário";
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal-custom')) {
            event.target.style.display = "none";
        }
    }
</script>

<style>
    .modal-custom {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content-custom {
        background-color: #fefefe;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 500px;
        max-width: 90%;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal-header-custom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    .close-custom {
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close-custom:hover {
        color: #002b5c;
    }
</style>
{% endblock %}
