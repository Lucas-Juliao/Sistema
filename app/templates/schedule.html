{% extends "base.html" %}

{% block title %}Agenda - Safira MusiCloud{% endblock %}
{% block header_title %}Agenda de Professores{% endblock %}

{% block content %}
<div class="form-container">
    <form id="schedule-form">
        <div class="form-group">
            <label for="teacher_sched">Professor</label>
            <select id="teacher_sched" name="teacher_sched" class="form-control" required>
                <option value="1">Maria Oliveira</option>
            </select>
        </div>
        <div class="form-group">
            <label for="day_of_week">Dia da Semana</label>
            <select id="day_of_week" name="day_of_week" class="form-control" required>
                <option value="segunda">Segunda-feira</option>
                <option value="terca">Terça-feira</option>
                <option value="quarta">Quarta-feira</option>
                <option value="quinta">Quinta-feira</option>
                <option value="sexta">Sexta-feira</option>
                <option value="sabado">Sábado</option>
            </select>
        </div>
        <div class="form-group">
            <label for="start_time">Horário de Início</label>
            <input type="time" id="start_time" name="start_time" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="end_time">Horário de Término</label>
            <input type="time" id="end_time" name="end_time" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary">Configurar Disponibilidade</button>
    </form>
</div>
{% endblock %}
